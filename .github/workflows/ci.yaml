name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linter:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build schemas
        run: pnpm --filter schemas build

      - name: Lint API
        run: pnpm --filter api lint

      - name: Lint Web
        run: pnpm --filter web lint

  test-unit:
    name: Test Unitaire & Implémentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build schemas
        run: pnpm --filter schemas build

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Run tests
        run: pnpm --filter api test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          JWT_ACCESS_SECRET: "test-access-secret"
          JWT_REFRESH_SECRET: "test-refresh-secret"
          ENABLE_EMAIL: "false"

      - name: Verify coverage (main only)
        if: github.base_ref == 'main'
        run: pnpm --filter api test:coverage
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          JWT_ACCESS_SECRET: "test-access-secret"
          JWT_REFRESH_SECRET: "test-refresh-secret"
          ENABLE_EMAIL: "false"

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build schemas
        run: pnpm --filter schemas build

      - name: Generate Prisma Client
        run: pnpm --filter api prisma:generate

      - name: Build API
        run: pnpm --filter api build

      - name: Build Web
        run: pnpm --filter web build
