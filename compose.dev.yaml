name: armali-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
      target: dev
    working_dir: /app
    command: >
      sh -c "
        cd /app &&
        pnpm dev:schemas &
        pnpm db:init && pnpm dev:api
      "
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_workspace_modules:/app/apps/api/node_modules
      - schemas_node_modules:/app/packages/schemas/node_modules
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
      target: dev
    working_dir: /app
    command: >
      sh -c "
        cd /app &&
        pnpm dev:schemas & pnpm dev:web
      "
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_workspace_modules:/app/apps/web/node_modules
      - schemas_node_modules:/app/packages/schemas/node_modules
    env_file:
      - .env.dev
    environment:
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - frontend

  mailhog:
    image: mailhog/mailhog:latest
    container_name: armali-mailhog
    ports:
      - "1025:1025" # Port SMTP
      - "8025:8025" # Interface web
    networks:
      - backend

  devcontainer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
      target: deps
    working_dir: /app
    command: sleep infinity
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_workspace_modules:/app/apps/api/node_modules
      - web_workspace_modules:/app/apps/web/node_modules
      - schemas_node_modules:/app/packages/schemas/node_modules
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - frontend
      - db

volumes:
  postgres_data:
  api_node_modules:
  api_workspace_modules:
  web_node_modules:
  web_workspace_modules:
  schemas_node_modules:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  db:
    driver: bridge