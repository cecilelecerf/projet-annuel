version: "3.9"
services:
  traefik:
    image: traefik:v2.10
    command:
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@armali.online"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/letsencrypt"
    networks:
      - frontend
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_user
      - db_password
      - db_name
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
  migration:
    image: ${DOCKER_HUB_USERNAME}/pa-api:latest
    entrypoint:
      - /scripts/migrate.sh
    secrets:
      - db_user
      - db_password
      - db_name
    networks:
      - backend
    deploy:
      replicas: 0
      restart_policy:
        condition: none
      update_config:
        order: start-first
        failure_action: continue

  seed:
    image: ${DOCKER_HUB_USERNAME}/pa-seed:latest
    entrypoint:
      - /scripts/seed.sh
    secrets:
      - db_user
      - db_password
      - db_name
      - aws_access_key_id_v2
      - aws_secret_access_key_v2
      - s3_bucket
      - s3_endpoint
      - aws_region
    networks:
      - backend
    deploy:
      replicas: 0
      restart_policy:
        condition: none
      update_config:
        order: start-first
        failure_action: continue

  api:
    image: ${DOCKER_HUB_USERNAME}/pa-api:latest
    environment:
      NODE_ENV: production
      CORS_ORIGIN: https://armali.online
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://s3.armali.online
      S3_BUCKET: armali-files
      AWS_REGION: us-east-1
      ASSETS_BASE_URL: https://s3.armali.online/armali-files
      ENABLE_EMAIL: "true"
      MAIL_FROM: "Armali <contact@armali.online>"
    secrets:
      - db_user
      - db_password
      - db_name
      - jwt_access_secret
      - jwt_refresh_secret
      - minio_root_user
      - minio_root_password
      - s3_bucket
      - s3_endpoint
      - aws_region
      - aws_access_key_id_v2
      - aws_secret_access_key_v2
      - stripe_secret_key
      - stripe_webhook_secret_v2
      - resend_api_key
    networks:
      - backend
      - frontend
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.hostname != docker-desktop
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  web:
    image: ${DOCKER_HUB_USERNAME}/pa-web:latest
    networks:
      - frontend
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure

  nginx:
    image: ${DOCKER_HUB_USERNAME}/pa-nginx:latest
    networks:
      - frontend
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.hostname != docker-desktop
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=cecoule_frontend"
        - "traefik.http.routers.mon_nginx.rule=Host(`armali.online`)"
        - "traefik.http.routers.mon_nginx.entrypoints=websecure"
        - "traefik.http.routers.mon_nginx.tls.certresolver=myresolver"
        - "traefik.http.services.mon_nginx.loadbalancer.server.port=80"

  prometheus:
    image: prom/prometheus:v3.4.0
    configs:
      - source: prometheus_config_v2
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - frontend
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname != docker-desktop
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:12.0.0
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana_dashboard_express
        target: /var/lib/grafana/dashboards/backend_overview.json
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - frontend
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname != docker-desktop
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=cecoule_frontend"
        - "traefik.http.routers.grafana.rule=Host(`grafana.armali.online`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=myresolver"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_API_CORS_ALLOW_ORIGIN: "https://armali.online"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - minio_root_user
      - minio_root_password
    networks:
      backend:
        aliases:
          - miniostorage
      frontend: {}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=cecoule_frontend"
        - "traefik.http.routers.minio_s3.rule=Host(`s3.armali.online`)"
        - "traefik.http.routers.minio_s3.entrypoints=websecure"
        - "traefik.http.routers.minio_s3.tls.certresolver=myresolver"
        - "traefik.http.services.minio_s3.loadbalancer.server.port=9000"

  minio-init:
    image: minio/mc:latest
    secrets:
      - minio_root_user
      - minio_root_password
    configs:
      - source: minio_init_script_v2
        target: /init.sh
        mode: 0755
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - backend

  backup:
    image: ${DOCKER_HUB_USERNAME}/pa-backup:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - backend
    secrets:
      - db_user
      - db_password
      - db_name
      - minio_root_user
      - minio_root_password
      - ovh_s3_access_key
      - ovh_s3_secret_key
      - aws_dr_access_key_id
      - aws_dr_secret_access_key
    environment:
      DB_HOST: cecoule_postgres
      MINIO_ENDPOINT: http://cecoule_minio:9000
volumes:
  prometheus-data:
    driver: local
  traefik_certs:
    driver: local
  postgres_data:
    driver: local
  grafana-data:
    driver: local
  minio_data:
    driver: local

networks:
  backend:
    driver: overlay
  frontend:
    driver: overlay

secrets:
  db_user:
    external: true
  db_password:
    external: true
  db_name:
    external: true
  jwt_access_secret:
    external: true
  jwt_refresh_secret:
    external: true
  grafana_admin_password:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
  s3_bucket:
    external: true
  s3_endpoint:
    external: true
  aws_region:
    external: true
  aws_access_key_id_v2:
    external: true
  aws_secret_access_key_v2:
    external: true
  stripe_secret_key:
    external: true
  stripe_webhook_secret_v2:
    external: true
  resend_api_key:
    external: true
  ovh_s3_access_key:
    external: true
  ovh_s3_secret_key:
    external: true
  aws_dr_access_key_id:
    external: true
  aws_dr_secret_access_key:
    external: true

configs:
  prometheus_config_v2:
    external: true
  grafana_datasources:
    external: true
  grafana_dashboards_provider:
    external: true
  grafana_dashboard_express:
    external: true
  minio_init_script_v2:
    external: true
