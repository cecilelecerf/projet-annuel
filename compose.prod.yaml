services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_name
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_user
      - db_password
      - db_name
    networks:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      # placement:
      #   constraints:
      #     - node.role == manager

  api:
    image: ${DOCKER_HUB_USERNAME}/pa-api:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost
    secrets:
      - db_user
      - db_password
      - db_name
      - jwt_access_secret
      - jwt_refresh_secret
    networks:
      - backend
      - frontend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  web:
    image: ${DOCKER_HUB_USERNAME}/pa-web:latest
    networks:
      - frontend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    image: ${DOCKER_HUB_USERNAME}/pa-nginx:latest
    ports:
      - "80:80"
    networks:
      - frontend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  postgres_data:

networks:
  backend:
    driver: overlay
  frontend:
    driver: overlay

secrets:
  db_user:
    external: true
  db_password:
    external: true
  db_name:
    external: true
  jwt_access_secret:
    external: true
  jwt_refresh_secret:
    external: true
