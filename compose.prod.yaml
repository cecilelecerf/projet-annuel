services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.labels.type == database
    networks:
      - backend

  api:
    # A remplacer par l'image depuis la registry
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost
    deploy:
      replicas: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend

  web:
    # A remplacer par l'image depuis la registry
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    deploy:
      replicas: 3
    networks:
      - frontend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    deploy:
      replicas: 3
    depends_on:
      - api
      - web
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  backend:
    driver: overlay
  frontend:
    driver: overlay
