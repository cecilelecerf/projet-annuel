global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "api"
    static_configs:
      - targets: ["api:3001"]
  # Santé des conteneurs (CPU, RAM, réseau, restarts…) via cAdvisor.
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
  # - job_name: "frontend"
  #   static_configs:
  #     - targets: ["web:80"]
